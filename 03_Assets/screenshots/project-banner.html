<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EnterpriseAIOps Banner</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 1600px; height: 620px; overflow: hidden; background: #07111f; color: #f4f7fb; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .canvas { position: relative; width: 1600px; height: 620px; padding: 74px 92px; background: linear-gradient(125deg, #07111f 0%, #0c2030 55%, #102b3c 100%); }
    .grid { position: absolute; inset: 0; opacity: .16; background-image: linear-gradient(#73daca 1px, transparent 1px), linear-gradient(90deg, #73daca 1px, transparent 1px); background-size: 48px 48px; mask-image: linear-gradient(90deg, #000 0%, transparent 82%); }
    .glow { position: absolute; width: 480px; height: 480px; right: 140px; top: 70px; border: 1px solid rgba(93, 227, 202, .25); border-radius: 50%; box-shadow: 0 0 0 34px rgba(93, 227, 202, .04), 0 0 0 70px rgba(93, 227, 202, .03); }
    .glow:before, .glow:after { content: ""; position: absolute; inset: 78px; border: 1px solid rgba(93, 227, 202, .32); border-radius: 50%; }
    .glow:after { inset: 160px; border-color: rgba(100, 170, 255, .34); }
    .node { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #5de3ca; box-shadow: 0 0 22px #5de3ca; }
    .n1 { right: 365px; top: 164px; } .n2 { right: 216px; top: 305px; background: #76a9ff; box-shadow: 0 0 22px #76a9ff; } .n3 { right: 412px; top: 445px; }
    .eyebrow { position: relative; color: #5de3ca; font-size: 18px; letter-spacing: .2em; font-weight: 700; }
    h1 { position: relative; margin: 20px 0 14px; font-size: 62px; line-height: 1.1; letter-spacing: .02em; }
    .en { position: relative; margin: 0; color: #a8bfd0; font-size: 25px; letter-spacing: .12em; }
    .line { position: relative; margin-top: 36px; width: 520px; height: 2px; background: linear-gradient(90deg, #5de3ca, transparent); }
    .tags { position: relative; display: flex; gap: 12px; margin-top: 28px; }
    .tag { padding: 9px 14px; border: 1px solid rgba(148, 201, 220, .32); color: #d8e7ed; font-size: 15px; border-radius: 5px; background: rgba(255,255,255,.04); }
    .side { position: absolute; right: 92px; bottom: 76px; color: #86a7b8; font-size: 14px; letter-spacing: .1em; }
  </style>
</head>
<body><div class="canvas"><div class="grid"></div><div class="glow"></div><i class="node n1"></i><i class="node n2"></i><i class="node n3"></i><div class="eyebrow">AI OPS / MULTI-AGENT PLATFORM</div><h1>企业级多Agent智能运维系统</h1><p class="en">ENTERPRISE AIOPS · OBSERVABLE · RECOVERABLE · SAFE</p><div class="line"></div><div class="tags"><span class="tag">异常检测</span><span class="tag">根因分析</span><span class="tag">审批自愈</span><span class="tag">DeepSeek</span><span class="tag">Docker</span></div><div class="side">PYTHON · KAFKA · POSTGRESQL · QDRANT</div></div></body>
</html>
