services:
  api:
    build:
      context: ../..
      dockerfile: 02_Source/agent_tech_portfolio/Dockerfile
    environment:
      AIOPS_DATA_DIR: /app/data
      AIOPS_STORAGE: ${AIOPS_STORAGE:-sqlite}
      AIOPS_DATABASE_URL: ${AIOPS_DATABASE_URL:-postgresql://aiops:aiops_password@postgres:5432/aiops}
      AIOPS_CELERY_BROKER: redis://redis:6379/0
      AIOPS_EVENT_BUS: ${AIOPS_EVENT_BUS:-memory}
      AIOPS_KAFKA_BOOTSTRAP: ${AIOPS_KAFKA_BOOTSTRAP:-kafka:9092}
      AIOPS_TOPOLOGY: ${AIOPS_TOPOLOGY:-json}
      AIOPS_SAFETY_BACKEND: ${AIOPS_SAFETY_BACKEND:-memory}
      AIOPS_SAFETY_REDIS_URL: redis://redis:6379/1
      AIOPS_SAFETY_KEY_PREFIX: ${AIOPS_SAFETY_KEY_PREFIX:-project024:aiops:safety}
      AIOPS_LLM: ${AIOPS_LLM:-auto}
      AIOPS_DEEPSEEK_API_KEY: ${AIOPS_DEEPSEEK_API_KEY:-}
      AIOPS_DEEPSEEK_MODEL: ${AIOPS_DEEPSEEK_MODEL:-deepseek-chat}
      AIOPS_DEEPSEEK_ENDPOINT: ${AIOPS_DEEPSEEK_ENDPOINT:-https://api.deepseek.com/chat/completions}
      AIOPS_REPAIR_EXECUTOR: ${AIOPS_REPAIR_EXECUTOR:-dry-run}
      AIOPS_REPAIR_COMMANDS: ${AIOPS_REPAIR_COMMANDS:-}
      AIOPS_REPAIR_TIMEOUT: ${AIOPS_REPAIR_TIMEOUT:-30}
      AIOPS_CMDB: ${AIOPS_CMDB:-none}
      AIOPS_CMDB_URL: ${AIOPS_CMDB_URL:-}
      AIOPS_RAG: ${AIOPS_RAG:-none}
      AIOPS_VECTOR_DB_URL: ${AIOPS_VECTOR_DB_URL:-}
      AIOPS_VECTOR_DB_COLLECTION: ${AIOPS_VECTOR_DB_COLLECTION:-aiops_runbooks}
      AIOPS_LOKI_URL: ${AIOPS_LOKI_URL:-}
      AIOPS_JAEGER_URL: ${AIOPS_JAEGER_URL:-}
      AIOPS_LOG_PATH: ${AIOPS_LOG_PATH:-}
    ports:
      - "${AIOPS_API_PORT:-18024}:8000"
    volumes:
      - aiops_app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: 02_Source/agent_tech_portfolio/Dockerfile
    command: ["celery", "-A", "celery_app:celery_app", "worker", "--pool=solo", "--concurrency=1", "--loglevel=INFO"]
    environment:
      AIOPS_DATA_DIR: /app/data
      AIOPS_STORAGE: ${AIOPS_STORAGE:-sqlite}
      AIOPS_DATABASE_URL: ${AIOPS_DATABASE_URL:-postgresql://aiops:aiops_password@postgres:5432/aiops}
      AIOPS_CELERY_BROKER: redis://redis:6379/0
      AIOPS_EVENT_BUS: ${AIOPS_EVENT_BUS:-memory}
      AIOPS_KAFKA_BOOTSTRAP: ${AIOPS_KAFKA_BOOTSTRAP:-kafka:9092}
      AIOPS_TOPOLOGY: ${AIOPS_TOPOLOGY:-json}
      AIOPS_SAFETY_BACKEND: ${AIOPS_SAFETY_BACKEND:-memory}
      AIOPS_LLM: ${AIOPS_LLM:-auto}
      AIOPS_DEEPSEEK_API_KEY: ${AIOPS_DEEPSEEK_API_KEY:-}
      AIOPS_DEEPSEEK_MODEL: ${AIOPS_DEEPSEEK_MODEL:-deepseek-chat}
      AIOPS_DEEPSEEK_ENDPOINT: ${AIOPS_DEEPSEEK_ENDPOINT:-https://api.deepseek.com/chat/completions}
      AIOPS_REPAIR_EXECUTOR: ${AIOPS_REPAIR_EXECUTOR:-dry-run}
      AIOPS_REPAIR_COMMANDS: ${AIOPS_REPAIR_COMMANDS:-}
      AIOPS_REPAIR_TIMEOUT: ${AIOPS_REPAIR_TIMEOUT:-30}
      AIOPS_CMDB: ${AIOPS_CMDB:-none}
      AIOPS_CMDB_URL: ${AIOPS_CMDB_URL:-}
      AIOPS_RAG: ${AIOPS_RAG:-none}
      AIOPS_VECTOR_DB_URL: ${AIOPS_VECTOR_DB_URL:-}
      AIOPS_VECTOR_DB_COLLECTION: ${AIOPS_VECTOR_DB_COLLECTION:-aiops_runbooks}
      AIOPS_LOKI_URL: ${AIOPS_LOKI_URL:-}
      AIOPS_JAEGER_URL: ${AIOPS_JAEGER_URL:-}
      AIOPS_LOG_PATH: ${AIOPS_LOG_PATH:-}
    volumes:
      - aiops_app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "worker_health"]
      interval: 15s
      timeout: 8s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - aiops_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "${AIOPS_REDIS_PORT:-6380}:6379"
    volumes:
      - aiops_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiops_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiops}
    ports:
      - "${AIOPS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - aiops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiops} -d ${POSTGRES_DB:-aiops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "${AIOPS_QDRANT_PORT:-6333}:6333"
    volumes:
      - aiops_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/aiops_password
    volumes:
      - aiops_neo4j_data:/data

volumes:
  aiops_app_data:
  aiops_kafka_data:
  aiops_redis_data:
  aiops_neo4j_data:
  aiops_postgres_data:
  aiops_qdrant_data:
